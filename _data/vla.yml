  - id: l6
    title:
      zh: 11 / L6 切除停顿并注入过渡动作
      en: 11 / L6 cut pauses and inject bridging actions
    paragraphs:
    - zh: 在 2,876 条录像上实测，关键段内停顿长度中位 8 帧（30 Hz，p90 为 22 帧），相邻停顿间隔中位 32 帧；间隔 ≤ 10 帧的占 14%，“两三个挨得很近”的停顿确实存在。切掉停顿后，接缝处按前后平均速度注入过渡动作，用三次
        Hermite 插值；注入帧只作动作目标，不作样本起点（它们没有图像）。
      en: Measured on 2,876 recordings, pauses inside core segments last a median 8 frames (30 Hz; p90 22 frames),
        and the median gap between neighbouring pauses is 32 frames, with 14% of gaps at 10 frames or less, so clusters
        of close pauses are real. After a pause is cut, a bridging action at the seam uses the mean velocity before
        and after, with cubic Hermite interpolation. Injected frames serve only as action targets, never as sample
        starts, because they have no images.
    - zh: 公开做法不同：openpi 处理 DROID 数据时不拼接、不插值，只禁止在静止段及其前约半个动作块内取样本起点，动作块仍读原始的未来。它更简单、零风险，但动作块里仍会出现停顿，适合作为 L6 的对照实验。
      en: Public practice differs. openpi, on DROID, neither splices nor interpolates; it only forbids sample starts
        inside idle segments and about half a chunk before them, and chunks still read the raw future. That is simpler
        and risk-free, but pauses remain inside chunks, so it is a good control experiment for L6.
    items: []
    table:
      zh:
        head:
        - 参数
        - 取值
        - 依据
        rows:
        - - 最短切除停顿
          - ≥ 6 帧（0.2 s）
          - 更短的是手抖级别，切了反而破坏连续性
        - - 估速窗口 k
          - 5 帧
          - 与静止判据的 ±5 帧一致；间隔中位 32 帧，两侧都够用
        - - 合并规则
          - 间隔 < 10 帧的相邻切段合成一段，只注入一次
          - 否则估速窗口会跨进另一个停顿
        - - 注入速度
          - 前后平均速度，三次 Hermite 插值
          - 保证接缝处速度连续
        - - 接触窗
          - 不切，也不跨接触窗合并
          - 接触前后的细小停顿可能就是技能边界
      en:
        head:
        - Parameter
        - Value
        - Reason
        rows:
        - - Shortest pause to cut
          - ≥ 6 frames (0.2 s)
          - Shorter pauses are hand tremor; cutting them breaks continuity
        - - Velocity window k
          - 5 frames
          - Matches the ±5-frame idle rule; with a 32-frame median gap, both sides fit
        - - Merging
          - Cuts less than 10 frames apart merge, with one injection
          - Otherwise the velocity window reaches into another pause
        - - Injected velocity
          - Mean of before and after, cubic Hermite interpolation
          - Keeps velocity continuous at the seam
        - - Contact window
          - Never cut, never merged across
          - Small pauses around contact can be skill boundaries
  - id: l7
    title:
      zh: 12 / L7 速度归一到基准采集员
      en: 12 / L7 normalize speed to the benchmark operator
    paragraphs:
    - zh: 按关键段（10 cm → 抓取 → 5 cm）统计每位采集员的中位时长。目标现场的基准采集员最快，但这位采集员在另一站点的 SOP 里慢了 45%，所以目标速度取其在目标现场的关键段，而不是按人名一刀切。场景难度也有影响：同一位采集员在
        SOP 里 3.23 s，在难例里 4.45 s。因此比例只在同场景内比，跨场景只对齐自由段。
      en: For each operator, take the median duration of core segments (10 cm → grasp → 5 cm). The target site's
        benchmark operator is the fastest, yet the same person is 45% slower in another site's SOP, so the target
        speed is the operator's target-site core segments rather than anything tied to a name. Scene difficulty
        matters too; one operator takes 3.23 s in the SOP but 4.45 s on hard cases. Ratios are therefore compared
        within a scene, and only free-motion segments are aligned across scenes.
    - zh: 公开工作的结论一致：DemoSpeedup 只加速自由段，均匀 2 倍反而掉成功率；ESPADA 只加速非接触段；SAIL 在实机上提速明显，但接触多的任务例外；TempoVLA 则把速度作为条件输入。
      en: Public work agrees. DemoSpeedup accelerates only free motion, and uniform 2× hurts success; ESPADA accelerates
        only casual segments; SAIL gains a lot on real robots except in contact-rich tasks; TempoVLA conditions
        on speed as an input.
    items:
    - zh: 分段：关键段分成自由段（10 cm → 接触窗开始、接触窗结束 → 5 cm）和接触窗。
      en: 'Split: the core segment divides into free-motion segments (10 cm → start of contact window, end of contact
        window → 5 cm) and the contact window.'
    - zh: 算比例：每段 r = 该段时长 / 基准采集员同段中位时长。
      en: 'Ratio: r = segment duration / the benchmark operator''s median for the same segment.'
    - zh: 只加速不减速：r > 1 的自由段按 r 抽帧，图像和动作同步抽，不需要合成图像；r ≤ 1 不动；接触窗保持 1 倍。
      en: 'Speed up only: free segments with r > 1 are subsampled by r, images and actions together, so no images
        need to be synthesized; r ≤ 1 is left alone; the contact window stays at 1×.'
    - zh: 顺序：先 L6 切停顿，再 L7；否则停顿会把 r 拉大。
      en: 'Order: L6 pause removal before L7, otherwise pauses inflate r.'
