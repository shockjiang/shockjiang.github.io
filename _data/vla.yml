  - id: results
    title:
      zh: 13 / 全流程跑在全部数据上的结果
      en: 13 / Results of the full pipeline on all data
    paragraphs:
    - zh: L0–L7 在全部取放数据上跑完：9,328 条录像、16,688 只活动手臂、约 2,049 万帧，单进程约 2 分钟。只生成标签，不改训练文件。失败后的恢复段一律训练（4,410 段，之前有 46%
        被失败段误置 0）；L6 不切接触窗，124.8 万接触帧一帧未动。关键段帧数经 L6、L7 后共减少约 31%，目标现场只减少 10%（它本来就快）。
      en: L0–L7 ran on all pick-and-place data, 9,328 recordings, 16,688 active arms and about 20.49 million frames,
        in roughly two minutes on a single process. It only writes labels and leaves training files untouched. Recovery
        after failure is always trained (4,410 segments; previously 46% had been zeroed by neighbouring failure
        segments). L6 never cuts the contact window, so all 1.248 million contact frames are untouched. Core frames
        shrink by about 31% after L6 and L7, but only 10% at the target site, which was already fast.
