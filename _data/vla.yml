  - id: takeaways
    title:
      zh: 14 / 小结与仍缺的部分
      en: 14 / Takeaways and what is still missing
    paragraphs: []
    items:
    - zh: 先筛后用：信号、夹爪、相机的明显问题在 L0 一次查完，并作为自动检查跑在每次新数据同步上；“流是活的、但身份错了”这类问题，靠人眼发现太晚。
      en: 'Screen before use: signal, gripper and camera problems are caught once in L0 and checked automatically
        on every sync. Problems where the stream is alive but its identity is wrong are found too late by eye.'
    - zh: 多源数据要有准入标准：按姿态和目标场景比较（L1.3），而不是按来源整体接收或丢弃；名义上的同一任务，实测可能只有 2% 合格。
      en: 'Multi-source data needs an admission rule: compare poses with the target scene (L1.3) instead of accepting
        or rejecting whole sources; a nominally identical task may qualify only 2% of the time.'
    - zh: 只借关键段：其他来源只贡献 10 cm → 抓取 → 5 cm 的关键段，接触窗加权、不切、不加速。
      en: 'Borrow only the core: other sources contribute only the 10 cm → grasp → 5 cm segment, with the contact
        window weighted, never cut and never sped up.'
    - zh: 3D 轨迹对比是判断数据好坏的核心工具：抓取瞬间的关节与位姿说明“是不是同一个动作”，整条路径的极值和折返说明“采得干不干净”，还能追查到采集设置这样的根因。
      en: 3D trajectory comparison is the core tool for judging data. Joints and pose at the grasp tell whether
        it is the same move, extrema and backtracking along the path tell how clean the demonstration is, and the
        comparison can expose root causes such as collection setup.
    - zh: 归一化是混训的前提：数值上，归一化统计量按每次的数据组合重算；时间上，L6 切停顿、L7 统一速度；空间轨迹的平滑和对齐先从关键段做起，以抓取点和上下两个高度为锚点。
      en: 'Normalization comes before mixing: recompute normalization statistics for every data mix; in time, L6
        removes pauses and L7 aligns speed; in space, smoothing and alignment start with the core segment, anchored
        at the grasp point and the two heights.'
    - zh: 仍缺的部分：周期级质量分与去重；按采集员或场次划分训练集和验证集（随机按录像抽会让相似周期两边都有）；按采集员或站点平衡采样；以及针对轨迹多极值、前伸折返的处理层。
      en: 'Still missing: cycle-level quality scores and deduplication; train/validation splits by operator or session
        (random splits by recording put similar cycles on both sides); balanced sampling by operator or site; and
        a layer that handles multiple extrema and overshoot in trajectories.'
