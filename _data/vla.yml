  - id: traj-pose
    title:
      zh: 06 / 3D 轨迹对比（一）：抓取瞬间的姿态离目标有多远
      en: '06 / 3D trajectory comparison (1): how far grasp poses are from the target'
    paragraphs:
    - zh: 不同来源采的数据，有的训练效果好，有的不好，判断的核心是比较 3D 轨迹。第一步看抓取瞬间：在“夹爪开始闭合”这一帧，取每次抓取的 7 个关节角、躯干坐标系下的末端位姿和躯干状态，逐个来源与目标现场的抓取集合比较。“区域内”指到最近目标抓取的距离不超过目标自身留一最近邻的
        p95（关节 0.25 rad，位置 18 mm）；姿态差是与位置最近的目标抓取之间的旋转角。
      en: Some sources train well and some do not, and the core test is to compare 3D trajectories. Start with the
        moment of grasping. At the frame where the gripper starts closing, take the seven joint angles, the end-effector
        pose in the torso frame and the torso state, and compare each source with the target site's set of grasps.
        In region means the distance to the nearest target grasp is within the target's own leave-one-out p95 (0.25
        rad in joints, 18 mm in position). Orientation difference is the rotation to the positionally nearest target
        grasp.
