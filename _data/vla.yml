intro:
  zh: 从真实场景出发，记录 VLA 从数据、模型到现场交付的实践。
  en: Practical notes on taking VLA from data and models to real-world operation.
articles:
- id: vla-delivery
  title:
    zh: 如何完成VLA交付：以小件拣选为例
    en: 'How to Deliver a VLA System: A Small-Parts Picking Case'
  summary:
    zh: 从交付目标、SOP 与硬件选型开始，建立数据、模型、控制和真机反馈的完整闭环。全文以一个单臂从杂乱料框拣选小件、放上传送带的现场项目为例，每一步都给出实际做法和数据。
    en: Start with delivery goals, SOP design and hardware, then close the loop across data, policy, control and
      real-robot feedback. Every step is illustrated with a field project in which a single arm picks small parts
      from a cluttered bin onto a conveyor.
  sections:
  - id: case
    title:
      zh: 00 / 实例：单臂小件拣选
      en: '00 / The case: single-arm small-parts picking'
    paragraphs:
    - zh: 任务是让一只机械臂从杂乱的料框里逐个夹起小盒，放到传送带上。策略是 π0.5 类的视觉—语言—动作模型，先用另一站点的遥操 SOP 数据起步，再加入目标现场的数据，部署在现场的边缘 GPU 上。从第一次现场测试到客户认可的演示，用了
        26 天。下面各节的“小件拣选实例”都来自这个项目。
      en: A single arm picks small boxes one by one from a cluttered bin and places them on a conveyor. The policy
        is a π0.5-class vision-language-action model, bootstrapped from teleoperated SOP data collected at another
        site, then extended with data from the target site and deployed on an on-site edge GPU. It took 26 days
        from the first field test to a demonstration the customer accepted. Every "small-parts picking example"
        below comes from this project.
    items: []
    table:
      zh:
        head:
        - 指标
        - 结果
        rows:
        - - 现场峰值节拍
          - 680 件/小时
        - - 稳定运行节拍
          - 420 件/小时
        - - 杂乱料框单次夹取成功率
          - 41% → 75–94%
        - - 服务端单次推理
          - 165 → 42 ms（机器人侧 48.5 ms）
        - - 研发自测评星
          - 1 → 4.3 星
        - - 训练 / 现场评测
          - 25 天 104 个模型；8 天 30 次现场评测
      en:
        head:
        - Metric
        - Result
        rows:
        - - Peak throughput on site
          - 680 pieces/hour
        - - Sustained throughput
          - 420 pieces/hour
        - - Single-grasp success in a cluttered bin
          - 41% → 75–94%
        - - Server-side inference per request
          - 165 → 42 ms (48.5 ms measured on the robot)
        - - Internal star rating
          - 1 → 4.3 stars
        - - Training / field evaluation
          - 104 models in 25 days; 30 field evaluations in 8 days
  - id: goals
    title:
      zh: 01 / 先确认交付目标
      en: 01 / Define delivery goals
    paragraphs:
    - zh: VLA（Vision-Language-Action，视觉—语言—动作）交付通常面对固定、单一的业务场景，可以利用目标物、目标位置和工位布局等先验，通过后训练与强化学习缩短迭代周期。它与追求广泛泛化的预训练、中期训练有不同的侧重点。
      en: VLA (Vision-Language-Action) delivery usually targets a specific operational setting. Object, destination
        and workstation priors can support faster iteration through post-training and reinforcement learning, with
        different priorities from pre-training and mid-training.
    - zh: 交付要求系统在现场持续工作，成功率、节拍、精度和异常恢复都要达到约定要求。因此，第一步是确认交付目标；第二步是设计 SOP（标准操作流程）并选择合适的硬件。数据采集应在这些决策之后启动。
      en: Delivery requires sustained operation on site, with agreed success rate, cycle time, accuracy and recovery
        behavior. Confirm these goals first, then design the standard operating procedure (SOP) and select hardware.
        Data collection follows those decisions.
    items:
    - zh: 明确任务边界：处理什么物体、覆盖哪些位置、允许哪些环境变化，以及哪些情况需要人工协作。
      en: 'Define task boundaries: objects, reachable locations, allowed environmental changes and cases requiring
        human assistance.'
    - zh: 把成功率与节拍一起评估，提前约定测试条件和失败的判定方式。研发、采集与交付场地不一致时，要逐项对齐差异。
      en: Evaluate success rate together with cycle time, and agree on test conditions and failure criteria. Reconcile
        differences across development, collection and delivery sites.
    example:
      zh: 验收目标定为“件/小时”加单次夹取成功率，两者一起看。复盘中最大的教训是目标中途变了：项目开始只做单臂取放，后来又加入双臂和混合堆叠场景，人力和机器被分散，进度反而变慢。评价标准也要在立项时定好并带版本号：离线主指标前后改过四次口径，不同口径的数字无法直接比较。
      en: Acceptance combined pieces per hour with single-grasp success rate. The biggest lesson was that the goal
        moved mid-project. It started as single-arm picking, then dual-arm and mixed stacking scenes were added,
        which split people and robots and slowed everything down. Fix the evaluation metric at kickoff and version
        it; our main offline metric changed definition four times, and numbers across definitions could not be compared.
  - id: hardware
    title:
      zh: 02 / 硬件先跑通整个工作空间
      en: 02 / Validate hardware across the workspace
    paragraphs: []
    items:
    - zh: 臂展与夹爪：覆盖所有操作位置，检查开口宽度、闭合速度，以及异形物体能否夹稳。夹爪根部读数不一定等于指尖的实际间距。
      en: 'Reach and gripper: cover all operating locations; check opening width, closing speed and grasp stability
        on irregular objects. A reading at the gripper base may differ from the actual fingertip gap.'
    - zh: 边缘与角落：验证抓取箱边、箱角物体时，夹爪和腕上相机是否与料框干涉。
      en: 'Edges and corners: check whether the gripper or wrist camera collides with the bin while reaching boundary
        objects.'
    - zh: 视觉与触觉：主相机要覆盖完整场景，末端结构不能遮挡关键信息；检查触觉信号能否区分对齐与未对齐状态。
      en: 'Vision and touch: the main camera must cover the scene without critical occlusion by the end effector.
        Check whether tactile signals distinguish aligned and misaligned contact.'
    - zh: 先检查机械和传感问题：夹爪松动、电机掉电、图像模糊、视频帧率不足与重复帧，都可能表现为模型效果差。
      en: 'Check mechanics and sensing early: loose grippers, motor power loss, motion blur, low camera frame rate
        and duplicate frames can all appear as policy failures.'
    example:
      zh: 现场头部相机实际只有 12.5 fps，而数据按 30 Hz 记录，这类问题只有逐项实测才会发现。策略控制时，相机画面的像素抖动是遥操时的 2.1–2.5 倍，说明执行层抖动是真实存在的硬件问题，而不只是模型问题。指尖在腕部相机里是否可见也要提前确认：带指套和裸指的指尖外观不同，指尖检测和标注要分别处理。
      en: The head camera on site actually ran at 12.5 fps while data was logged at 30 Hz; only item-by-item measurement
        reveals such issues. Under policy control, image jitter was 2.1–2.5× that seen during teleoperation, so
        execution jitter was a real hardware problem, not only a policy problem. Check fingertip visibility in the
        wrist camera early as well; padded and bare fingertips look different, so fingertip detection and labels
        must handle both.
  - id: sop
    title:
      zh: 03 / SOP 是最关键、也最难的一步
      en: 03 / SOP design is the critical step
    paragraphs:
    - zh: 先用物理结构简化任务。例如，用斜坡辅助翻面，把双手操作改成单手操作。流程越简单、状态越可区分，模型学习与后续排障就越容易。
      en: 'Simplify the task physically first: a ramp may assist flipping, or a two-handed operation may become
        a one-handed one. Simpler procedures with distinguishable states are easier to learn and debug.'
    items:
    - zh: 固定机器人、工作台和料框的相对布局，并使场景能够在仿真器里复现；采集时让料框在允许的小范围内变化，覆盖真实部署偏差。料框底部可增加柔性垫层。
      en: Keep the robot, table and bin layout reproducible in simulation. Vary bin position within an allowed range
        during collection to cover deployment tolerances. A compliant layer at the bin bottom can reduce impact.
    - zh: 分别定义最佳流程、常规流程和失败恢复流程。用遥操作模拟典型错误，再采集顺势恢复的动作，覆盖抓空、滑落等状态。
      en: Define ideal, routine and recovery procedures separately. Reproduce typical errors through teleoperation
        and collect recovery actions for states such as missed grasps and slips.
    - zh: 减少误触、临时换目标、犹豫停顿和不必要的姿态调整。细小动作也会进入数据，进而影响模型行为。
      en: Reduce accidental contact, target switching, hesitation and unnecessary object adjustments. Small demonstration
        habits can become policy behavior.
    - zh: 检查动作歧义：复位与接近、抓取成功后的提升与抓空后的提升，可能在单帧中很相似。可用图像、夹爪宽度和关节角训练动作分类器，通过混淆矩阵定位难以区分的阶段。
      en: 'Check ambiguous stages: returning and approaching, or lifting after successful and failed grasps, may
        look alike in a single frame. An action classifier using images, gripper width and joint angles can expose
        confusion between stages.'
    - zh: 训练算法的人应亲自采集至少 10 条数据，关键相关人也建议参与，建立对流程难点和遥操作体感的共同理解。
      en: The person training the policy should collect at least ten demonstrations; key collaborators should also
        participate to develop a shared understanding of the procedure.
    example:
      zh: 采集从“每回合录一件”改为“每回合清空一整框”后，启停和复位一框只做一次，每件实际耗时从约 51 秒降到 24 秒，同样的工时采到的件数约为 2.2 倍。另外两个 SOP 层面的决定：回位（return）交给规则，不进训练，因为它和起始接近在画面与姿态上很像，混在一起训练会让模型混淆；等待阶段交给状态机、不查询策略——此前
        21% 的训练帧是等待帧，导致模型起步犹豫。
      en: Switching collection from one piece per episode to clearing a whole bin per episode meant start, stop
        and reset happened once per bin. Effective time per piece fell from about 51 s to 24 s, roughly 2.2× more
        pieces for the same hours. Two other SOP decisions followed. Returning home is executed by rules and excluded
        from training, because it looks like the initial approach and confuses the policy. Waiting is handled by
        a state machine without querying the policy; previously 21% of training frames were waiting frames, which
        made the policy hesitate at the start.
  - id: guardrails
    title:
      zh: 04 / 把安全护栏放进执行链路
      en: 04 / Put guardrails in the execution loop
    paragraphs: []
    items:
    - zh: 防触底应按夹爪末端的真实几何计算，例如指尖角点或边缘，不能只看机械臂末端参考点的高度。
      en: Detect bottom contact using the physical fingertip geometry, such as corners or edges, rather than only
        the end-effector reference position.
    - zh: 到达深度边界或出现“持续下压指令、实际位置不动”时，停止继续下压，保留允许的开合爪和上抬动作。回退上抬距离需结合工装、物体和可用空间确定，例如在空间允许时上抬 5 cm。
      en: At a depth limit, or when downward commands persist without corresponding motion, inhibit further descent
        while preserving permitted gripper and retreat actions. A 5 cm upward retreat is one example where clearance
        permits; actual thresholds depend on tooling, objects and clearance.
    - zh: 六维力传感器需要去重力、去加速度，并考虑负载影响。力信号只有经过校准与配套处理，才能可靠参与控制。
      en: Six-axis force sensing requires calibration and compensation for gravity, acceleration and payload before
        it can reliably inform control.
    example:
      zh: 单臂模型运行时，另一只手臂锁定在最后一次提交的位置；人工可以随时接管，每次接管都完整记录，之后成为再训练的数据。夹爪偶尔夹不紧，提升时物料滑落，所以闭合不完全交给模型：检测到闭合指令后，由规则按参考宽度（遥操闭合宽度的中位数，约
        28 mm）夹到位并保持，直到松开。
      en: While the single-arm policy runs, the other arm is locked at its last committed pose, and a human can
        take over at any time. Every takeover is logged and later reused as training data. Because the gripper sometimes
        failed to clamp firmly and parts slipped during lifting, closing was not left entirely to the policy. Once
        a close command is detected, a rule closes to a reference width (the teleoperation median, about 28 mm)
        and holds it until release.
  - id: data
    title:
      zh: 05 / 数据质量：正确动作与恢复动作都要有
      en: 05 / Collect clean demonstrations and recovery data
    paragraphs: []
    items:
    - zh: 每次遥操从约定初始位置开始，剔除接手前的抖动与观察阶段。动作果断，操作对象始终处于有效视野内。
      en: Start each demonstration from the agreed initial state. Remove takeover jitter and observation periods;
        execute decisively and keep relevant objects visible.
    - zh: 标注区分 task、sub-task 与 action/skill，并为特殊动作补充环境描述。小停顿可能是关键技能边界，不能一概作为无效数据删除。
      en: Distinguish task, sub-task and action/skill labels, with environmental context for special actions. Brief
        pauses can mark important skill boundaries and should not be removed indiscriminately.
    - zh: 清理无效静止帧和异常尖峰，按需平滑动作。模仿学习数据保留正确行为与恢复行为，但要剔除导致失败的错误动作片段。
      en: Remove irrelevant stationary frames and anomalous spikes, with action smoothing where appropriate. For
        imitation learning, retain correct behavior and recovery while excluding the preceding erroneous actions.
    example:
      zh: 小件拣选的数据预处理被整理成一条 L0–L7 的八层流水线：信号体检、周期与关键段切分、目标/辅助判定、抓取尝试与失败分类、技能标签、训练权重、停顿切除和速度归一，并用 3D 轨迹对比判断哪些来源的数据能用。详见本专题第二篇文章。
      en: 'Data preprocessing for small-parts picking became an eight-layer pipeline, L0–L7: signal checks, cycle
        and core-segment extraction, target/auxiliary admission, grasp attempts and failure classes, skill labels,
        training weights, pause removal and speed normalization, with 3D trajectory comparison deciding which sources
        are usable. See the second article in this series.'
  - id: training
    title:
      zh: 06 / 训练和离线评测盯住关键阶段
      en: 06 / Focus training and offline evaluation on critical stages
    paragraphs: []
    items:
    - zh: 针对真机抖动带来的图像变化做数据增强，避免只适应平稳遥操画面。
      en: Augment for image changes caused by robot motion so the policy does not rely solely on smooth teleoperation
        footage.
    - zh: 用反事实样本检查指令跟随；对特殊 SOP 分支补充场景与动作文本，结合动作和进度预测，检查模型是否区分不同阶段。
      en: Use counterfactual samples to assess instruction following. Annotate special SOP branches with scene and
        action descriptions, and consider action and progress prediction to distinguish stages.
    - zh: 在训练与评测中提高关键帧、关键 skill 的权重；按需加入末端执行器（EEF）相关辅助预测头与损失。整体平均误差之外，也要关注抓取、接触和恢复阶段。
      en: Weight critical frames and skills more heavily in training and evaluation, and consider end-effector auxiliary
        heads and losses. Inspect grasping, contact and recovery in addition to aggregate error.
    example:
      zh: 纯 VLA 最常见的失败是定位不准：没对准目标盒，或戳到盒边。我们在腕部相机图像上叠加检测器给出的旋转框（OBB）和指尖位置，并用确定性规则选出要抓的那个盒子；训练和服务用同一套规则（审计前两边选框不一致率高达
        53–58%）。叠加之后，杂乱料框的单次夹取成功率从 41% 升到 75–94%，每次成功耗时从 44 秒降到 11.5–19 秒。离线评测把接触前后关键窗口的权重提高到 5 倍，同时报告关节误差和末端位置误差（毫米）。
      en: The most common failure of a plain VLA policy was poor targeting, missing the target box or poking its
        edge. We drew detector outputs, oriented boxes (OBB) and fingertip positions, onto the wrist-camera image
        and used a deterministic rule to choose the box to pick. Training and serving use the same rule; before
        an audit they disagreed on the chosen box 53–58% of the time. With the overlay, single-grasp success in
        a cluttered bin rose from 41% to 75–94%, and time per successful pick fell from 44 s to 11.5–19 s. Offline
        evaluation weights the window around contact 5× and reports both joint error and end-effector position error
        in millimetres.
  - id: deployment
    title:
      zh: 07 / 从模型动作到平滑的底层控制
      en: 07 / Turn policy actions into smooth robot control
    paragraphs:
    - zh: 先单步执行，分别看目标是否抓得准、物体是否夹得稳、失败后是否能恢复。随后检查推理延迟、轨迹插值和底层控制，避免把执行链路问题全部归因于模型。
      en: Start with stepwise execution to assess targeting accuracy, grasp stability and recovery separately. Then
        inspect inference latency, trajectory interpolation and low-level control before attributing every failure
        to the policy.
    items:
    - zh: 以 30 Hz 的 action chunk 对接 500 Hz 底层控制为例：两者之间需要插值，五次多项式可用于构造位置、速度和加速度连续的轨迹。这些频率是实例，实际以机器人接口为准。
      en: Consider a 30 Hz action chunk feeding a 500 Hz controller. Interpolation bridges the rates; quintic polynomials
        can provide continuous position, velocity and acceleration. These rates are examples and must match the
        robot interface.
    - zh: 控制器过于强调位置到达时，可能放大抖动。应结合本体能力调试 PID，并在硬件支持时评估力位混合控制。
      en: An overly stiff position controller can amplify jitter. Tune PID for the platform and evaluate hybrid
        force/position control when supported.
    example:
      zh: 服务端单次请求从约 165 ms 降到 42 ms，机器人侧（上传 + 推理）实测 48.5 ms；精度不让步，始终保持 10 步去噪和 bf16。最大的一步是把推理换成单个 CUDA graph 引擎（140
        → 56 ms）。动作块按 30 Hz 执行，推理期间机器人继续执行已提交的 6 步旧动作（200 ms，实时分块），正好覆盖延迟。延迟不只在 GPU 上：机器人端改用 C++ 并上传 JPEG 后，上传从
        29 ms 降到 4.3 ms。还要注意时间基准：π0.5 的 50 步动作块在 50 Hz 下是 1 秒，在 30 Hz 下变成 1.67 秒。
      en: Server-side latency per request fell from about 165 ms to 42 ms, and the robot measured 48.5 ms end to
        end (upload plus inference), with no loss of accuracy; we kept 10 denoising steps and bf16 throughout. The
        biggest single gain came from a single-CUDA-graph inference engine (140 → 56 ms). Action chunks run at 30
        Hz, and during inference the robot keeps executing six committed steps of the previous chunk (200 ms, real-time
        chunking), which covers the latency. Latency is not only on the GPU; rewriting the robot client in C++ and
        uploading JPEG cut upload time from 29 ms to 4.3 ms. Watch the time base too; π0.5's 50-step chunk is 1
        s at 50 Hz but 1.67 s at 30 Hz.
  - id: rules
    title:
      zh: 08 / 模型与规则协作，重点是平滑接管
      en: 08 / Combine the policy with smooth rule-based handoffs
    paragraphs: []
    items:
    - zh: 抓取并提升到合适高度后，可由规则接管搬运、放置和返回等确定性动作，把模型能力集中在复杂交互阶段。
      en: After a successful grasp and lift, rules can handle deterministic carrying, placement and return motions,
        leaving the policy to manage complex interactions.
    - zh: 接管点、避障必经点和放置点之间要考虑速度与加速度连续；规则与模型切换也要避免突然停顿或跳变。放置位置可在允许范围内加入变化。
      en: Maintain smooth velocity and acceleration across handoff, obstacle-avoidance and placement points. Avoid
        abrupt stops or jumps when switching between rules and the policy. Placement can vary within the allowed
        region.
    - zh: 夹持稳定性需要单独验证。可在夹住后补充闭合动作以减少途中掉落，执行力度与次数需按物体和夹爪能力调整。
      en: Validate grasp retention separately. Additional closing actions after grasping may reduce slips; force
        and repetition must suit the object and gripper.
    example:
      zh: 规则只做三件 VLA 不擅长或不该冒险的事：选目标、判阶段、守边界。目标选择规则（选离指尖中点最近的盒子）让评星从 1 星升到 3 星；检测器判断当前阶段（下落 fall / 抓取 grasp / 抬起
        raise）并写进提示词；回位和等待由规则和状态机执行。所有规则都在服务端可复现，训练与推理用同一套，模型看到的输入始终在分布内。
      en: 'Rules do only three things a VLA policy is bad at or should not risk: choosing the target, determining
        the stage and enforcing limits. A target rule (the box nearest the fingertip midpoint) lifted the rating
        from 1 to 3 stars. A detector determines the current stage (fall, grasp or raise) and writes it into the
        prompt. Returning and waiting are executed by rules and a state machine. All rules are reproducible on the
        server and shared by training and inference, so the policy always sees in-distribution inputs.'
  - id: evaluation
    title:
      zh: 09 / 用真机反馈建立迭代闭环
      en: 09 / Close the loop with real-robot feedback
    paragraphs: []
    items:
    - zh: 把空料框、没有目标、腕上相机看不到目标等分布外状态纳入测试，并明确停止、恢复或人工接管的处理方式。
      en: Test out-of-distribution states such as empty bins, absent targets and missing wrist-camera views, with
        defined stop, recovery or assistance behavior.
    - zh: 每次真机测试保留人工反馈，区分定位不准、夹持不稳、恢复失败、控制抖动和硬件异常，再决定改数据、模型、SOP 还是控制链路。
      en: Keep human feedback for each real-robot evaluation. Distinguish targeting errors, unstable grasps, failed
        recovery, control jitter and hardware faults before choosing what to change.
    - zh: 回流真机数据，特别是抖动、模糊和失败恢复片段。真实部署图像与遥操图像存在差异，需要在下一轮采集和训练中覆盖。
      en: Feed real-robot data back into iteration, especially jitter, blur and recovery cases. Deployment imagery
        differs from demonstrations and needs coverage in subsequent collection and training.
    example:
      zh: 目标节奏是：每天训几个模型，早上测前一晚的模型，晚上测白天调整后的版本，测试录像每小时回流。25 天训练了 104 个模型，8 天里做了 30 次现场评测；旗舰模型按现场结果决定，而不是按离线排名。人工接管和现场回放被整理成带优势标签的
        RECAP 数据，RECAP 模型在托盘场景 187 次夹取中成功 185 次（98.9%）。现场失败集中的场景（如拥挤料框）单独补采为难例数据。
      en: The target rhythm was several models trained per day, the overnight model tested each morning and the
        adjusted version each evening, with test recordings synced back hourly. We trained 104 models in 25 days
        and ran 30 field evaluations in 8 days, and the flagship model was chosen by field results rather than offline
        ranking. Human takeovers and field replays became advantage-labelled RECAP data, and the RECAP model succeeded
        on 185 of 187 grasps (98.9%) in a tray scene. Scenes where field failures clustered, such as crowded bins,
        were collected again as hard cases.
  - id: handover
    title:
      zh: 10 / 交付前的核对清单
      en: 10 / Before handover
    paragraphs: []
    items:
    - zh: 目标已确认：任务范围、成功率、节拍、测试条件和人机协作边界有共同定义。
      en: 'Goals agreed: task scope, success rate, cycle time, test conditions and human-assistance boundaries are
        defined.'
    - zh: 流程已跑通：硬件可达、视野充分，常规 SOP 与恢复 SOP 都有对应数据和真机验证。
      en: 'Procedure validated: hardware reaches required locations, cameras provide sufficient coverage, and routine
        and recovery procedures have data and real-robot validation.'
    - zh: 执行可持续：安全护栏生效、规则接管平滑、空料框等异常状态有明确处理，已知硬件故障有排查方法。
      en: 'Operation supported: guardrails work, handoffs are smooth, exceptional states have defined handling and
        known hardware faults can be diagnosed.'
    - zh: 反馈能闭环：现场问题能归因，数据与人工反馈能进入下一轮迭代。必要时结合检测、跟踪与分割模块补足感知，并检查遮挡下不同模块输出的含义。
      en: 'Feedback actionable: site issues can be diagnosed, and data plus human feedback feed the next iteration.
        Detection, tracking and segmentation may supplement perception; check how their outputs differ under occlusion.'
    example:
      zh: 交付时仍要写进交接清单的未解决问题：执行层抖动；动作频率与动作块时长的匹配；没见过的物品状态和摆放；回位与起始接近这类相似阶段的混淆；以及戳边、碰框这类精细操作误差（30 条评测记录中有 12 条提到）。
      en: 'Open issues that still belong on the handover list: execution jitter; matching the action rate to the
        chunk duration; unseen object states and arrangements; confusion between similar stages such as returning
        and approaching; and fine-manipulation errors such as poking box edges or hitting the bin, mentioned in
        12 of 30 evaluation records.'
- id: vla-data-pipeline
  title:
    zh: VLA 数据预处理：以小件拣选为例的八层流水线（L0–L7）
    en: 'VLA Data Preprocessing: An Eight-Layer Pipeline (L0–L7) for Small-Parts Picking'
  summary:
    zh: 一条连续清框录像怎样变成训练样本：信号体检、切周期与关键段、按姿态判定目标数据、用 3D 轨迹对比筛选数据源、失败分类、技能标签、训练权重、停顿切除和速度归一。每一层都给出规则、阈值和在约两千万帧数据上的实测结果。
    en: 'How a continuous bin-clearing recording becomes training samples: signal checks, cycle and core-segment
      extraction, pose-based target admission, 3D trajectory comparison of data sources, failure classes, skill
      labels, training weights, pause removal and speed normalization. Each layer comes with its rules, thresholds
      and measured results on about twenty million frames.'
  sections:
  - id: why
    title:
      zh: 01 / 为什么数据处理决定上限
      en: 01 / Why data processing sets the ceiling
    paragraphs:
    - zh: 模型学到的上限由数据决定。在小件拣选项目里，多次出问题，根子都在数据：头部相机实际只有 12.5 fps；一批清框数据的左右腕部相机在录制端接反；失败恢复数据用法不同，离线误差能相差 −61% 到 +30%；回位和起始接近混在一起训练，模型会把两者搞混。所以每条录像进入训练之前，都要过同一条处理流水线。
      en: The data sets the ceiling on what a policy can learn. In the small-parts picking project, problem after
        problem traced back to data. The head camera actually ran at 12.5 fps; in one bin-clearing collection the
        left and right wrist cameras were swapped at the recorder; different uses of failure-recovery data moved
        offline error anywhere from −61% to +30%; and training on returning and initial approaching together confused
        the policy. Every recording therefore passes through the same processing pipeline before it reaches training.
    - zh: 下面三条是交付篇中“数据质量”一节的原则，八层流水线把它们变成了可执行、可统计的规则：
      en: 'The three principles below come from the data-quality section of the delivery article; the eight layers
        turn them into executable, measurable rules:'
    items:
    - zh: 每次遥操从约定初始位置开始，剔除接手前的抖动与观察阶段。动作果断，操作对象始终处于有效视野内。
      en: Start each demonstration from the agreed initial state. Remove takeover jitter and observation periods;
        execute decisively and keep relevant objects visible.
    - zh: 标注区分 task、sub-task 与 action/skill，并为特殊动作补充环境描述。小停顿可能是关键技能边界，不能一概作为无效数据删除。
      en: Distinguish task, sub-task and action/skill labels, with environmental context for special actions. Brief
        pauses can mark important skill boundaries and should not be removed indiscriminately.
    - zh: 清理无效静止帧和异常尖峰，按需平滑动作。模仿学习数据保留正确行为与恢复行为，但要剔除导致失败的错误动作片段。
      en: Remove irrelevant stationary frames and anomalous spikes, with action smoothing where appropriate. For
        imitation learning, retain correct behavior and recovery while excluding the preceding erroneous actions.
  - id: overview
    title:
      zh: 02 / 八层总览：从一条录像到训练样本
      en: '02 / Overview: from one recording to training samples'
    paragraphs:
    - zh: 采集方式是“连续清框”：一条录像里连续抓取多个物品，中间有成功、空抓、碰触、恢复和停顿。流水线先做 L0 信号体检，再用 L1–L7 七层把录像切开、分类、加权和对齐。左右臂各自独立处理；所有层只生成标签，不改原始数据，因此任何一层的规则都可以单独修改、重算。
      en: Data is collected by continuous bin clearing, with many picks per recording, mixing successes, empty grasps,
        touches, recoveries and pauses. The pipeline first runs the L0 signal check, then seven layers, L1–L7, cut,
        classify, weight and align the recording. Left and right arms are processed independently. Every layer only
        writes labels and never edits raw data, so any layer's rules can be changed and recomputed on their own.
    items: []
    table:
      zh:
        head:
        - 层
        - 单位
        - 做什么
        - 解决什么
        rows:
        - - L0 信号体检
          - 每条录像每只手臂
          - 关节跳变、FK 一致性、夹爪读数与指令、时间戳、相机同步
          - 初筛：问题段训练权重置 0
        - - L1.1 完整周期
          - 周期
          - HOME → 抓取 → 抬起 → 放下 → 回 HOME
          - 非关键阶段只从目标场景取
        - - L1.2 关键段（核心）
          - 周期
          - 物体上方 10 cm → 抓取 → 抬到物体上方 5 cm
          - 只借最难、最值得学的一段
        - - L1.3 目标 / 辅助
          - 关键段
          - 三个时刻的关节姿态与目标场景比较
          - 多源数据的准入标准
        - - L2 尝试
          - 抓取尝试
          - 每次下探到抓取高度算一次，无论是否闭合
          - 找出空抓、碰触等失败尝试
        - - L3 结果
          - 尝试
          - 成功或 F1–F14 失败类型
          - 失败不学，恢复要学
        - - L4 技能
          - 每帧
          - 三段（fall / grasp / raise）+ 12 技能
          - 阶段提示与细粒度数据分析
        - - L5 权重
          - 每帧
          - 是否训练 0/1；接触窗权重 ×2
          - 汇总成训练权重
        - - L6 停顿切除
          - 帧序列
          - 切掉停顿，接缝处注入过渡动作
          - 采集员的停顿习惯
        - - L7 速度归一
          - 每段
          - 自由段速度对齐到基准采集员，接触窗不变速
          - 采集员的速度差异
      en:
        head:
        - Layer
        - Unit
        - What it does
        - What it solves
        rows:
        - - L0 signal check
          - Each recording and arm
          - Joint jumps, FK consistency, gripper reading vs command, timestamps, camera sync
          - 'Screening: faulty segments get zero training weight'
        - - L1.1 full cycle
          - Cycle
          - HOME → grasp → lift → place → HOME
          - Non-critical phases come only from the target scene
        - - L1.2 core segment
          - Cycle
          - 10 cm above the object → grasp → lift to 5 cm above it
          - Borrow only the hardest, most valuable segment
        - - L1.3 target / auxiliary
          - Core segment
          - Compare joint poses at three moments with the target scene
          - Admission rule for multi-source data
        - - L2 attempts
          - Grasp attempt
          - Every descent to grasp height counts, closed or not
          - Find empty grasps, touches and other failed attempts
        - - L3 outcomes
          - Attempt
          - Success or failure classes F1–F14
          - Do not learn failures; do learn recoveries
        - - L4 skills
          - Frame
          - Three stages (fall / grasp / raise) plus 12 skills
          - Stage prompts and fine-grained data analysis
        - - L5 weights
          - Frame
          - Train 0/1; contact window weighted ×2
          - Combine everything into training weights
        - - L6 pause removal
          - Frame sequence
          - Cut pauses, inject bridging actions at the seams
          - Operators' pause habits
        - - L7 speed normalization
          - Segment
          - Align free-motion speed to the benchmark operator; contact window unchanged
          - Speed differences between operators
  - id: l0
    title:
      zh: 03 / L0 信号体检：先把明显有毛病的去掉
      en: '03 / L0 signal check: remove the obviously broken first'
    paragraphs:
    - zh: 参考 Qwen 机器人操作工作中的状态—动作过滤，每条录像的每只手臂先过 L0。不通过的整段或局部标记为 qa_fail，训练权重置 0。表中阈值是初值，跑完全量数据后按分布再定。
      en: Following the state-action filtering in Qwen's robot-manipulation work, each arm of each recording first
        passes L0. Failing segments, or whole recordings, are marked qa_fail and get zero training weight. The thresholds
        are initial values, to be revised from the distribution after a full pass.
    - zh: 在 9,328 个文件、16,688 条单臂录像上跑完 L0：2,556 条含问题段，主要是时间戳跳变（2,412 条）和夹爪读数与指令对不上（115 条）。
      en: Across 9,328 files and 16,688 single-arm recordings, 2,556 contained faulty segments, mainly timestamp
        gaps (2,412) and gripper readings that did not follow commands (115).
    items: []
    table:
      zh:
        head:
        - 检查
        - 怎么判
        - 初始阈值
        rows:
        - - 关节跳变
          - 相邻帧关节差或其二阶差突增
          - 单帧 > 0.2 rad，或 > 该关节 p99.9 的 3 倍
        - - 极值 / 越限
          - 关节超出 URDF 限位或录像内 p0.1–p99.9 之外
          - 超限即标
        - - FK 一致
          - 由记录的关节算 FK，与记录的末端位姿比较
          - 位置 > 1–2 cm 或姿态 > 5°
        - - 夹爪读数 vs 指令
          - 指令闭合 ≥ 1 s 后实测宽度应下降
          - 下降 < 6 mm 即标
        - - 状态冻结
          - 关节整段不变而指令在变
          - '> 2 s'
        - - 时间戳 / 掉帧
          - 相邻时间戳差
          - '> 200 ms'
        - - 相机健康与身份
          - 黑帧、冻结、重复帧、帧率；左右腕部相机是否接反
          - 同步偏移 > 2 帧
      en:
        head:
        - Check
        - Rule
        - Initial threshold
        rows:
        - - Joint jumps
          - Sudden rise in frame-to-frame joint change or its second difference
          - '> 0.2 rad in one frame, or > 3× the joint''s p99.9'
        - - Extremes / limit violations
          - Joints beyond URDF limits or outside the recording's p0.1–p99.9
          - Flag on violation
        - - FK consistency
          - FK from recorded joints vs the recorded end-effector pose
          - '> 1–2 cm or > 5°'
        - - Gripper reading vs command
          - Measured width must drop after ≥ 1 s of a close command
          - Flag if drop < 6 mm
        - - Frozen state
          - Joints constant while commands change
          - '> 2 s'
        - - Timestamps / dropped frames
          - Gap between consecutive timestamps
          - '> 200 ms'
        - - Camera health and identity
          - Black, frozen or duplicate frames, frame rate; swapped left/right wrist cameras
          - Sync offset > 2 frames
    example:
      zh: 一批清框数据的 108 条录像，左右腕部相机全部在录制端接反了。数据流本身是“活”的，帧率、画面都正常，靠人眼很难及时发现。身份检查利用一个简单事实：干活那只手臂的相机画面变化大、深度近，闲着那只几乎不动。原始数据改正后，这项检查在每次同步新数据时自动运行。
      en: In one bin-clearing collection, all 108 recordings had the left and right wrist cameras swapped at the
        recorder. The streams were alive, with normal frame rates and images, so people did not notice in time.
        The identity check relies on a simple fact; the camera on the working arm changes a lot and sees things
        close by, while the idle arm's camera barely moves. After the raw data was fixed, the check runs automatically
        on every sync.
  - id: l1
    title:
      zh: 04 / L1 切周期与关键段：最难的是抓取本身
      en: '04 / L1 cycles and core segments: the grasp is the hard part'
    paragraphs:
    - zh: 完整周期是 HOME → 抓取 → 抬起 → 放下 → 回 HOME，只保留目标场景的数据。关键段（核心）是从物体上方 10 cm 下落 → 抓取 → 抬到物体上方 5 cm（高度以闭合时刻的末端高度为物体参考），这是整个动作里最难、最值得学的部分。借用其他
        SOP 或其他场景的数据时，只借这一段；从 home 出发、搬运、放下、回位这些容易学的阶段，只从目标场景取。
      en: A full cycle runs HOME → grasp → lift → place → HOME and is kept only for the target scene. The core segment
        runs from 10 cm above the object down to the grasp and up to 5 cm above the object, with the end-effector
        height at closing as the object reference. It is the hardest and most valuable part of the motion. When
        borrowing data from other SOPs or scenes, borrow only this segment; the easy phases (leaving home, carrying,
        placing, returning) come only from the target scene.
    - zh: 统一定义之前，每条流水线各用一套规则，同样叫 focus / lift 的帧在不同数据集里完全不同：一套里 focus 从抓取点上方约 1.7 cm 开始、lift 抬到约 15 cm；另一套里 focus
        从约 3.6 cm 开始、lift 只抬约 4.1 cm。按新定义，在 2,582 条录像、11,329 次有效闭合上，95% 能同时找到“上方 10 cm”和“抬到 5 cm”两个锚点；剩下的取“上一次张开以来的最高点”作起点。侧向取物时，起点改为“离抓取点
        10 cm”。
      en: Before the definitions were unified, each pipeline had its own rules, and frames called focus or lift
        meant different things in different datasets. In one, focus began about 1.7 cm above the grasp point and
        lift ended near 15 cm; in another, focus began near 3.6 cm and lift ended at about 4.1 cm. Under the new
        definition, 95% of 11,329 valid closes in 2,582 recordings have both anchors, 10 cm above and lifted 5 cm.
        The rest start from the highest point since the previous opening. For side picks, the start is 10 cm from
        the grasp point instead.
    items: []
    table:
      zh:
        head:
        - 来源
        - 10 cm → 闭合
        - 闭合 → 抬起 5 cm
        - 关键段总长
        rows:
        - - 目标现场（基准采集员）
          - 2.43 s
          - 0.53 s
          - 3.03 s
        - - 另一站点 SOP
          - 2.60 s
          - 0.60 s
          - 3.23 s
        - - 堆叠场景
          - 2.92 s
          - 1.00 s
          - 4.03 s
        - - 难例（拥挤料框）
          - 3.70 s
          - 0.67 s
          - 4.45 s
        - - 失败恢复
          - 4.33 s
          - 1.03 s
          - 5.43 s
      en:
        head:
        - Source
        - 10 cm → close
        - Close → lifted 5 cm
        - Core total
        rows:
        - - Target site (benchmark operator)
          - 2.43 s
          - 0.53 s
          - 3.03 s
        - - SOP from another site
          - 2.60 s
          - 0.60 s
          - 3.23 s
        - - Stacking scene
          - 2.92 s
          - 1.00 s
          - 4.03 s
        - - Hard cases (crowded bin)
          - 3.70 s
          - 0.67 s
          - 4.45 s
        - - Failure recovery
          - 4.33 s
          - 1.03 s
          - 5.43 s
    example:
      zh: 新定义的 focus 会包含约 1 秒的快速下降：手臂在 10 cm 处还在快速下落，大约到 3–4 cm 才减速。关键段内部再标出接触窗——夹爪接触物体前 45 帧到后 5 帧，训练权重加倍，后面的停顿切除和速度归一都不碰这一段。
      en: The new focus includes about one second of fast descent, because the arm is still dropping quickly at
        10 cm and only slows at around 3–4 cm. Inside the core segment, the contact window runs from 45 frames before
        to 5 frames after the fingers touch the object. It gets double training weight, and pause removal and speed
        normalization never touch it.
  - id: l13
    title:
      zh: 05 / L1.3 目标还是辅助：按姿态而不是按来源
      en: '05 / L1.3 target or auxiliary: decide by pose, not by source'
    paragraphs:
    - zh: 在关键段上再分一层：这次抓取和目标场景是不是“同一个动作”。判据是 HOME、抓取、抬起 5 cm 三个时刻的 7 个关节角，到最近的目标场景关键段的距离都不超过目标场景自身留一最近邻距离的 p95（HOME
        0.092 rad、抓取 0.243 rad、抬起 0.227 rad）。通过的按子类训练（正常抓取、失败后的恢复抓取、现场回收的 RECAP 数据等）；不通过的标为辅助，只作辅助训练。失败恢复从失败处开始，不比
        HOME。
      en: 'One more split on the core segment: is this grasp the same move as in the target scene? The rule compares
        the seven joint angles at three moments, HOME, grasp and lifted 5 cm, with the nearest target-scene core.
        Each distance must be within the p95 of the target scene''s own leave-one-out nearest-neighbour distance
        (HOME 0.092 rad, grasp 0.243 rad, lift 0.227 rad). Passing cores train under their subtype (normal grasp,
        recovery after failure, field RECAP data and so on); the rest are marked auxiliary. Recovery cores start
        where the failure happened, so HOME is not compared for them.'
    items:
    - zh: 目标现场自己 88% 三者都在范围内，与“半径覆盖约 80–90% 样本”的设计一致。
      en: The target site itself has 88% within range at all three moments, consistent with radii meant to cover
        about 80–90% of samples.
    - zh: 另一站点的 SOP 名义上是同一任务，实测只有 2% 合格：HOME 的关节角整体偏 0.1–0.23 rad 且非常集中（换了起始姿态），抓取时手腕翻滚差约 0.3 rad。按关节角，它不是同一个动作。
      en: The SOP from another site is nominally the same task, yet only 2% qualify. Its HOME joints are offset
        by 0.1–0.23 rad and tightly clustered (a different start pose), and wrist roll at the grasp differs by about
        0.3 rad. By joint angles, it is not the same move.
    - zh: 多品类小件来源和双臂数据接近 0%：它们仍然有用，但只能作辅助数据，不能当目标数据混训。
      en: Multi-item small-parts data and dual-arm data are close to 0%. They are still useful, but only as auxiliary
        data, not mixed in as target data.
    table:
      zh:
        head:
        - 来源
        - 关键段
        - HOME 在范围内
        - 抓取在范围内
