    example:
      zh: 多品类小件来源 2,077 次抓取没有一次落在目标区域内。其中 33% 的抓取手腕翻转了约 180°（前臂偏航关节在 +2…+4 rad，目标现场是 −2…0）。平行夹爪在几何上等价，但在关节空间里是另一组姿态。追查下去，原因在采集设置而不是操作员：某几天录的每条录像从第一帧起前臂就转在另一侧，整条不回正，之后几天全部正常。同一来源的抓取点比目标低
        14 cm，51% 的抓取时躯干在动，而状态里并没有躯干信息——这些都只有在 3D 对比里才看得出来。
      en: Not one of the 2,077 grasps from the multi-item small-parts source falls inside the target region. In
        33% of them the wrist is flipped by about 180° (the forearm yaw joint sits at +2…+4 rad versus −2…0 at the
        target site). A parallel gripper is geometrically symmetric, but in joint space this is a different pose.
        The cause was the collection setup, not the operators; on a few days every recording started with the forearm
        rotated to the other side and never re-centred, and later days were normal. The same source grasps 14 cm
        lower than the target, and the torso moves during 51% of its grasps although the state does not include
        the torso. Only a 3D comparison makes these visible.
  - id: traj-path
    title:
      zh: 07 / 3D 轨迹对比（二）：路径形状、采集员差异与筛选
      en: '07 / 3D trajectory comparison (2): path shape, operator differences and selection'
    paragraphs:
    - zh: 第二步看整条关键段路径：以抓取点为原点，把每次抓取从物体上方 10 cm 画到抬起 5 cm，比较俯视、侧视、正视三视图和可旋转的 3D 图。即使是同一场景，不同人采的数据差别也很大：平滑的抓取只在抓取点附近有一个极值；有人下落时来回调整，轨迹前伸、折返，空中出现多个极值。
      en: Next, compare whole core paths. With the grasp point as the origin, draw each grasp from 10 cm above the
        object to the 5 cm lift and compare top, side and front views plus a rotatable 3D view. Even within one
        scene, operators differ a lot. A smooth grasp has a single extremum near the grasp point; others adjust
        back and forth on the way down, overshooting and backtracking, with several extrema in mid-air.
    items:
    - zh: 速度：以目标现场的基准采集员为准，其他采集员的自由段要提速约 1.1 到 3 倍才追平。
      en: 'Speed: measured against the target site''s benchmark operator, other operators'' free-motion segments
        need a 1.1× to 3× speed-up to match.'
    - zh: 停顿：有人在空中明显停住，有人一气呵成。
      en: 'Pauses: some operators stop visibly in mid-air, others move in one continuous stroke.'
    - zh: 极值点：目标现场平均每次 1.2 个、38% 一个都没有；另一站点 SOP 1.6 个；多品类小件 3.0 个；双臂录像 4.6 个。
      en: 'Extrema: 1.2 per grasp at the target site, with none in 38% of grasps; 1.6 for the other site''s SOP;
        3.0 for multi-item small parts; 4.6 for dual-arm recordings.'
    - zh: 筛选规则：先按 L1.3 的姿态区域决定目标还是辅助；再用速度（L7）和停顿（L6）对齐；轨迹多极值、前伸折返目前只做统计，是下一步要补的处理层。
      en: 'Selection: L1.3 pose regions decide target versus auxiliary; speed (L7) and pauses (L6) are then aligned.
        Multiple extrema and overshoot are only measured so far and are the next layer to add.'
    - zh: 去抖：遥操数据在运动时带约 10 Hz 的抖动分量。基于 DCT 的自适应平滑在 200 条 SOP 录像上去掉了 7–13 Hz 的抖动、完整保留 0–3 Hz 的动作，加加速度（jerk）降低 95%，但尚未接入训练验证。
      en: 'De-jittering: teleoperation data carries a roughly 10 Hz component during motion. Adaptive DCT smoothing
        on 200 SOP recordings removed the 7–13 Hz jitter, kept 0–3 Hz motion intact and cut jerk by 95%; it has
        not yet been validated in training.'
    figure:
      src:
        zh: assets/images/vla/grasp-trajectories-zh.svg
        en: assets/images/vla/grasp-trajectories-en.svg
      alt:
        zh: 四类来源的抓取轨迹侧视图
        en: Side view of grasp trajectories from four sources
      caption:
        zh: 侧视图（向前 – 高度，单位 mm）。每个来源随机取最多 14 次抓取，从物体上方 10 cm 画到抬起 5 cm，红点为抓取点。A 目标现场基准采集员的路径最干净；C、D 的路径前伸、折返明显，空中极值多。
        en: Side view (forward vs height, mm). Up to 14 random grasps per source, drawn from 10 cm above the object
          to the 5 cm lift; the red dot is the grasp point. The target site's benchmark operator (A) has the cleanest
          paths; C and D overshoot and backtrack, with many mid-air extrema.
  - id: l23
    title:
      zh: 08 / L2–L3 抓取尝试与失败分类：F1–F14
      en: '08 / L2–L3 grasp attempts and failure classes: F1–F14'
    paragraphs:
    - zh: 一个周期里每次下探到抓取高度都算一次尝试，无论是否闭合。每次尝试落到“成功”或 14 类失败之一。能可靠测量的现在就处理；测不出或归不了类的标记为“已见、暂不处理”，对应段训练权重为 0。F14 是兜底类，收容高度可疑但测不出的情况。
      en: Every descent to grasp height within a cycle counts as an attempt, whether or not the gripper closes.
        Each attempt ends as a success or one of 14 failure classes. Classes that can be measured reliably are handled
        now; the rest are marked seen but unprocessed, with zero training weight. F14 is the catch-all for highly
        suspicious cases that cannot be measured or classified.
    - zh: 全部数据共 38,045 次尝试：成功 24,712；抬起前重夹（F9）5,255；手指触碰（F2）3,632；下探放弃（F1）2,412；其他可疑（F14）780；空抓（F5）473；抓到窄边（F7）342；抬起时脱落（F10）322。注意：没有力信号时，F1
        / F2 里可能有一部分只是重新对准、并没有碰到物体；它们之后的回升按恢复训练。
      en: 'All data together has 38,045 attempts: 24,712 successes, 5,255 regrasps before lift (F9), 3,632 finger
        touches (F2), 2,412 aborted descents (F1), 780 other suspicious (F14), 473 empty closes (F5), 342 edge grasps
        (F7) and 322 drops during lift (F10). Without force sensing, some F1/F2 cases may just be re-alignment without
        contact; the rise that follows them is trained as recovery.'
    items: []
    table:
      zh:
        head:
        - 类别
        - 名称
        - 判据
        - 处理
        rows:
        - - F1
          - 下探放弃
          - 到抓取高度附近未闭合即抬起
          - 暂不处理
        - - F2
          - 手指触碰
          - 末端在抓取高度附近局部低点、回弹 ≥ 0.5 cm、未闭合
          - 处理
        - - F3
          - 推挤 / 碰歪
          - 未闭合时物体跟踪位移 > 0.35 个物长或 > 10°
          - 处理（有物体跟踪的数据）
        - - F4
          - 选错目标
          - 对准的物体 ≠ 最后抓起的物体
          - 暂不处理
        - - F5
          - 空抓
          - 闭合期间最窄宽度 ≤ 20 mm
          - 处理
        - - F6
          - 没夹紧 / 夹偏
          - 最窄宽度 42–48 mm
          - 暂不处理 → F14
        - - F7
          - 抓到窄边
          - 宽度 6–13 mm 且夹着移动 ≥ 20 cm
          - 处理
        - - F8
          - 错位闭合
          - 在非物体位置闭合（需物体跟踪）
          - 暂不处理
        - - F9
          - 抬起前重夹
          - 抬起前多于一次闭合，含夹住—拖动—重夹
          - 处理：拖动段不训，最后一次夹取起训练
        - - F10
          - 抬起时脱落
          - 抬起中宽度 < 5 mm
          - 处理
        - - F11
          - 搬运中掉落
          - 夹到过、放下指令前掉到 < 5 mm
          - 处理
        - - F12
          - 空夹爪搬运
          - 从未夹到却移动 ≥ 20 cm
          - 处理
        - - F13
          - 碰撞
          - 手臂或物体碰到料框 / 其他物体（需跟踪或力信号）
          - 暂不处理
        - - F14
          - 其他可疑
          - 高度怀疑有问题但测不出、归不了类
          - 训练权重 0，待人工复核
      en:
        head:
        - Class
        - Name
        - Rule
        - Handling
        rows:
        - - F1
          - Aborted descent
          - Rises near grasp height without closing
          - Not yet handled
        - - F2
          - Finger touch
          - Local low point near grasp height, rebound ≥ 0.5 cm, no close
          - Handled
        - - F3
          - Push / knock
          - Tracked object moves > 0.35 object lengths or > 10° before closing
          - Handled (with object tracking)
        - - F4
          - Wrong target
          - Aligned object ≠ the object finally picked
          - Not yet handled
        - - F5
          - Empty close
          - Minimum width ≤ 20 mm while closing
          - Handled
        - - F6
          - Partial close
          - Minimum width 42–48 mm
          - Not yet handled → F14
        - - F7
          - Edge grasp
          - Width 6–13 mm while moving ≥ 20 cm
          - Handled
        - - F8
          - Misplaced close
          - Closing away from any object (needs tracking)
          - Not yet handled
        - - F9
          - Regrasp before lift
          - More than one close before lifting, including grip-drag-regrip
          - 'Handled: drag not trained, train from the last grasp'
        - - F10
          - Drop during lift
          - Width < 5 mm while lifting
          - Handled
        - - F11
          - Drop while carrying
          - Held once, falls below 5 mm before the release command
          - Handled
        - - F12
          - Carrying with an empty gripper
          - Never held but moves ≥ 20 cm
          - Handled
        - - F13
          - Collision
          - Arm or object hits the bin or other objects (needs tracking or force)
          - Not yet handled
        - - F14
          - Other suspicious
          - Highly suspicious but unmeasurable or unclassifiable
          - Zero weight, pending human review
  - id: l4
    title:
      zh: 09 / L4 技能标签：12 类技能与三段
      en: '09 / L4 skill labels: 12 skills and 3 stages'
    paragraphs:
    - zh: 一个抓放周期里有很多种动作。每一帧按动作的作用标成 12 类技能，再归并成三段（fall / grasp / raise）作为模型的阶段提示。新定义下，focus 从抓取点上方约 10 cm 开始到闭合指令为止，lift
        只到抬起约 5 cm，之后到放下前算 carry。有遥操作夹爪指令的数据用规则切，没有的用腕部检测器的技能头逐帧预测再平滑，两者在共有数据上对账。
      en: A pick-and-place cycle contains many kinds of motion. Each frame gets one of 12 skills by what the motion
        does, and the skills merge into three stages (fall, grasp, raise) used as stage prompts. Under the new definitions,
        focus runs from about 10 cm above the grasp point to the close command, lift ends at about 5 cm, and the
        rest until release is carry. Data with teleoperation gripper commands is segmented by rules; data without
        them uses a wrist detector's skill head per frame plus smoothing, and the two are reconciled where both
        exist.
    items:
    - zh: 停顿多少：目标现场和另一站点 SOP 有 24–25% 的帧在 wait，多品类小件只有 6%。
      en: 'How much pausing: 24–25% of frames are wait at the target site and in the other site''s SOP, only 6%
        for multi-item small parts.'
    - zh: 对准花多久：focus 在目标现场占 17%，堆叠和双臂占 24–31%，后两者在物体上方调整的时间明显更长。
      en: 'How long alignment takes: focus is 17% of frames at the target site versus 24–31% for stacking and dual-arm
        data, which spend much longer adjusting above the object.'
    - zh: 失败和恢复在哪里：失败恢复数据有 2.7% 的帧是 touch、1.4% 是 lift_recovery、12% 是 other；目标现场几乎为 0。
      en: 'Where failures and recoveries are: in failure-recovery data 2.7% of frames are touch, 1.4% lift_recovery
        and 12% other; at the target site these are almost zero.'
    - zh: 关键动作有多少：真正闭合抓取（close_gripper）在所有数据里只占 3% 的帧，这正是关键段要加权、不能被其他阶段淹没的原因。
      en: 'How rare the key action is: actual closing (close_gripper) is only 3% of all frames, which is why the
        core segment is weighted rather than drowned out by other phases.'
    table:
      zh:
        head:
        - 三段
        - 技能
        - 含义
        rows:
        - - fall
          - approach
          - 从高处向物体下落接近
        - - fall
          - focus
          - 在物体上方对准、微调（从约 10 cm 起）
        - - grasp
          - close_gripper
          - 闭合夹爪抓取
        - - raise
          - lift
          - 抓住后抬起（到约 5 cm）
        - - raise
          - lift_recovery
          - 失败后抬起、重新开始
        - - —
          - touch
          - 失败：手指碰到物体或料框，没抓住
        - - —
          - carry
          - 搬运到放置点
        - - —
          - open_gripper
          - 张开夹爪放下
        - - —
          - return
          - 回到 home（保留标签，一般不训练）
        - - —
          - wait
          - 停住等待
        - - —
          - global_observe
          - 在 home 附近观察全局
        - - —
          - other
          - 以上都不是，包括空抓等其他失败段
      en:
        head:
        - Stage
        - Skill
        - Meaning
        rows:
        - - fall
          - approach
          - Descend toward the object from above
        - - fall
          - focus
          - Align and fine-tune above the object (from about 10 cm)
        - - grasp
          - close_gripper
          - Close the gripper
        - - raise
          - lift
          - Lift after grasping (to about 5 cm)
        - - raise
          - lift_recovery
          - Lift after a failure, then start again
        - - —
          - touch
          - 'Failure: fingers touch the object or bin without grasping'
        - - —
          - carry
          - Carry to the placement point
        - - —
          - open_gripper
          - Open the gripper to release
        - - —
          - return
          - Return home (label kept, normally not trained)
        - - —
          - wait
          - Stop and wait
        - - —
          - global_observe
          - Observe the scene near home
        - - —
          - other
          - None of the above, including empty closes and other failures
  - id: l5
    title:
      zh: 10 / L5 是否训练与权重
      en: 10 / L5 what to train and how much
    paragraphs:
    - zh: 前面各层的结论在 L5 汇总成逐帧的训练开关和权重。权重按动作块里的每一步计算：块里落在失败帧上的步，权重为 0。公开工作里，GiB 同样把坏段的模仿损失置 0；π*0.6 的 RECAP 则不屏蔽，而是给坏动作打低优势标签——可以作为第二方案。
      en: L5 combines the earlier layers into per-frame training switches and weights. Weights apply to each step
        of an action chunk; steps that land on failure frames get zero weight. Among public work, GiB likewise zeroes
        the imitation loss on bad segments, while π*0.6's RECAP keeps them and assigns low advantage labels instead,
        which is a possible second approach.
